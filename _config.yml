# Site settings
title: GeoNavigator
description: A choose-your-own adventure for creating maps and working with GIS data. 
baseurl: "/GeoNavigator" # the subpath of your site - this is your repository name
url: "https://ucgis.github.io" # the base hostname & protocol for your site

# Theme
remote_theme: just-the-docs/just-the-docs

# Custom CSS
aux_links_new_tab: false

# This tells Just the Docs to load a custom stylesheet
custom_css: 
  - /assets/css/custom.css

# Collections
collections:
  questions:
    output: true
    permalink: /questions/:name/
  resources:
    output: true
    permalink: /resources/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "questions"
    values:
      layout: "question"
  - scope:
      path: ""
      type: "resources"
    values:
      layout: "resource"

# Just the Docs theme settings
search_enabled: true
heading_anchors: true

# Color scheme (using UC brand colors)
color_scheme: uc

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer content
footer_content: 
  <p><b>Need Help?</b>  If you have questions or need assistance, <a href="https://docs.google.com/spreadsheets/d/1xkgsnwz5MXEIpD9OMWajIPKpSdTdlb7THoeWCirHR7A/edit?usp=sharing">please contact a GIS specialist at your UC campus.</a></p>
  <p>Site created by the <a href="https://community-ucgis.hub.arcgis.com/pages/geoconnect">University of California GeoConnect Working Group</a>, members of the <a href="https://libraries.universityofcalifornia.edu/">UC Library System</a>.</p>
  <p>
    <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/"
       target="_blank"
       rel="noopener noreferrer">
      CC BY-NC-SA 4.0
    </a>
  </p>

# Aux links (optional - for future use)
aux_links:
  "UC Library System":
    - "https://libraries.universityofcalifornia.edu/"
